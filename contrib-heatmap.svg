<svg xmlns="http://www.w3.org/2000/svg" width="888" height="400" viewBox="0 0 888 400">
<defs>
<style>
  .logo-container { transform-box: fill-box; transform-origin: center; }
  .pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .glow { animation: glowEffect 0.8s ease-out both; }
  
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-180deg); }
    70% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  
  @keyframes glowEffect {
    0% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.8)); }
    100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
  }
  
  .label { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 28px; fill: #e6edf3; font-weight: 600; text-anchor: middle; }
  .description { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 18px; fill: #7d8590; text-anchor: middle; }
</style>
</defs>

<rect width="888" height="400" fill="none"/>

<!-- Ubuntu Logo -->
<g class="logo-container pop glow" style="animation-delay: 0.0s">
  <!-- Orange circle (Canonical/Ubuntu orange) -->
  <circle cx="148" cy="120" r="60" fill="none" stroke="#dd4814" stroke-width="8"/>
  
  <!-- Top arc/dot -->
  <circle cx="148" cy="45" r="12" fill="#dd4814"/>
  
  <!-- Bottom-left arc/dot -->
  <circle cx="85" cy="165" r="12" fill="#dd4814"/>
  
  <!-- Bottom-right arc/dot -->
  <circle cx="211" cy="165" r="12" fill="#dd4814"/>
  
  <!-- Center circle -->
  <circle cx="148" cy="120" r="20" fill="#dd4814"/>
</g>

<!-- Windows Logo - Toda Azul -->
<g class="logo-container pop glow" style="animation-delay: 0.2s">
  <!-- Top-left square - Blue -->
  <rect x="370" y="55" width="50" height="50" fill="#0078d4"/>
  
  <!-- Top-right square - Blue -->
  <rect x="440" y="55" width="50" height="50" fill="#0078d4"/>
  
  <!-- Bottom-left square - Blue -->
  <rect x="370" y="125" width="50" height="50" fill="#0078d4"/>
  
  <!-- Bottom-right square - Blue -->
  <rect x="440" y="125" width="50" height="50" fill="#0078d4"/>
</g>

<!-- Linux Penguin - Reformulado -->
<g class="logo-container pop glow" style="animation-delay: 0.4s">
  <!-- Cabeça -->
  <ellipse cx="688" cy="85" rx="38" ry="42" fill="#000000"/>
  
  <!-- Topo da cabeça (arredondado) -->
  <ellipse cx="688" cy="50" rx="28" ry="20" fill="#000000"/>
  
  <!-- Sombra na cabeça (3D) -->
  <ellipse cx="710" cy="65" rx="12" ry="18" fill="#333333" opacity="0.6"/>
  
  <!-- Olho esquerdo - Branco -->
  <ellipse cx="672" cy="80" rx="11" ry="14" fill="#ffffff"/>
  
  <!-- Olho direito - Branco -->
  <ellipse cx="704" cy="80" rx="11" ry="14" fill="#ffffff"/>
  
  <!-- Pupila esquerda -->
  <circle cx="674" cy="83" r="6" fill="#000000"/>
  
  <!-- Pupila direita -->
  <circle cx="702" cy="83" r="6" fill="#000000"/>
  
  <!-- Bico - Laranja -->
  <polygon points="688,98 675,115 701,115" fill="#ffa500"/>
  
  <!-- Bico sombra -->
  <polygon points="688,100 679,112 697,112" fill="#ff8c00"/>
  
  <!-- Corpo - Branco grande -->
  <ellipse cx="688" cy="170" rx="48" ry="65" fill="#ffffff"/>
  
  <!-- Barriguinha mais branca -->
  <ellipse cx="688" cy="175" rx="38" ry="55" fill="#f5f5f5"/>
  
  <!-- Asa esquerda -->
  <ellipse cx="655" cy="145" rx="22" ry="50" fill="#000000"/>
  
  <!-- Asa direita -->
  <ellipse cx="721" cy="145" rx="22" ry="50" fill="#000000"/>
  
  <!-- Pé esquerdo - Amarelo/Laranja -->
  <polygon points="665,225 645,245 665,245 685,245" fill="#ffa500"/>
  <polygon points="665,225 645,245 665,243" fill="#ff8c00"/>
  
  <!-- Pé direito - Amarelo/Laranja -->
  <polygon points="711,225 691,245 711,245 731,245" fill="#ffa500"/>
  <polygon points="711,225 691,245 711,243" fill="#ff8c00"/>
  
  <!-- Unhas/dedos esquerdo -->
  <polygon points="652,245 648,252 656,248" fill="#ff8c00"/>
  <polygon points="665,245 661,252 669,248" fill="#ff8c00"/>
  <polygon points="678,245 674,252 682,248" fill="#ff8c00"/>
  
  <!-- Unhas/dedos direito -->
  <polygon points="698,245 694,252 702,248" fill="#ff8c00"/>
  <polygon points="711,245 707,252 715,248" fill="#ff8c00"/>
  <polygon points="724,245 720,252 728,248" fill="#ff8c00"/>
</g>

<!-- Labels -->
<text class="label" x="148" y="290" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.5s;">Ubuntu</text>
<text class="description" x="148" y="315" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.6s;">Open-source OS</text>

<text class="label" x="412" y="290" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.7s;">Windows</text>
<text class="description" x="412" y="315" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.8s;">Windows</text>

<text class="label" x="688" y="290" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.9s;">Linux</text>
<text class="description" x="688" y="315" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 1.0s;">Penguin OS</text>

<!-- Footer -->
</svg>
