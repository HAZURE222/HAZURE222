<svg xmlns="http://www.w3.org/2000/svg" width="888" height="400" viewBox="0 0 888 400">
<defs>
<style>
  .logo-container { transform-box: fill-box; transform-origin: center; }
  .pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .glow { animation: glowEffect 0.8s ease-out both; }
  
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-180deg); }
    70% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  
  @keyframes glowEffect {
    0% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.8)); }
    100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
  }
  
  .label { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; fill: #e6edf3; font-weight: 600; text-anchor: middle; }
  .description { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; fill: #7d8590; text-anchor: middle; }
</style>
</defs>

<rect width="888" height="400" fill="none"/>

<!-- Ubuntu Logo -->
<g class="logo-container pop glow" style="animation-delay: 0.0s">
  <!-- Orange circle (Canonical/Ubuntu orange) -->
  <circle cx="148" cy="120" r="60" fill="none" stroke="#dd4814" stroke-width="8"/>
  
  <!-- Top arc/dot -->
  <circle cx="148" cy="45" r="12" fill="#dd4814"/>
  
  <!-- Bottom-left arc/dot -->
  <circle cx="85" cy="165" r="12" fill="#dd4814"/>
  
  <!-- Bottom-right arc/dot -->
  <circle cx="211" cy="165" r="12" fill="#dd4814"/>
  
  <!-- Center circle -->
  <circle cx="148" cy="120" r="20" fill="#dd4814"/>
</g>

<!-- Windows Logo -->
<g class="logo-container pop glow" style="animation-delay: 0.2s">
  <!-- Top-left square -->
  <rect x="380" y="50" width="45" height="45" fill="#0078d4"/>
  
  <!-- Top-right square -->
  <rect x="445" y="50" width="45" height="45" fill="#50e6ff"/>
  
  <!-- Bottom-left square -->
  <rect x="380" y="115" width="45" height="45" fill="#7fba00"/>
  
  <!-- Bottom-right square -->
  <rect x="445" y="115" width="45" height="45" fill="#ffb900"/>
</g>

<!-- Linux Penguin Logo -->
<g class="logo-container pop glow" style="animation-delay: 0.4s">
  <!-- Head -->
  <circle cx="688" cy="100" r="35" fill="#000000"/>
  
  <!-- Eyes -->
  <circle cx="675" cy="90" r="5" fill="#ffffff"/>
  <circle cx="701" cy="90" r="5" fill="#ffffff"/>
  
  <!-- Eye pupils -->
  <circle cx="676" cy="91" r="2" fill="#000000"/>
  <circle cx="702" cy="91" r="2" fill="#000000"/>
  
  <!-- Beak -->
  <polygon points="688,105 680,115 696,115" fill="#ff9900"/>
  
  <!-- Body -->
  <ellipse cx="688" cy="160" rx="40" ry="50" fill="#000000"/>
  
  <!-- Belly -->
  <ellipse cx="688" cy="165" rx="25" ry="45" fill="#ffffff"/>
  
  <!-- Left Wing -->
  <ellipse cx="655" cy="150" rx="20" ry="35" fill="#000000"/>
  
  <!-- Right Wing -->
  <ellipse cx="721" cy="150" rx="20" ry="35" fill="#000000"/>
  
  <!-- Left Foot -->
  <ellipse cx="670" cy="210" rx="12" ry="15" fill="#ff9900"/>
  
  <!-- Right Foot -->
  <ellipse cx="706" cy="210" rx="12" ry="15" fill="#ff9900"/>
</g>

<!-- Labels -->
<text class="label" x="148" y="280" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.5s;">Ubuntu</text>
<text class="description" x="148" y="305" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.6s;">Open-source OS</text>

<text class="label" x="412" y="280" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.7s;">Windows</text>
<text class="description" x="412" y="305" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.8s;">Microsoft OS</text>

<text class="label" x="688" y="280" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 0.9s;">Linux</text>
<text class="description" x="688" y="305" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 1.0s;">Penguin OS</text>

<!-- Footer -->
<text class="description" x="444" y="365" style="animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: 1.1s;">Powered by Open Source</text>
</svg>
